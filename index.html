<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080b17" />
    <meta
      name="description"
      content="A BlackHouse supernatural action roguelite. Every five seconds, your past becomes your ally."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>REVENANT LOOP · BlackHouse</title>
  </head>
  <body>
    <div id="app">
      <canvas id="world" aria-label="Revenant Loop game arena"></canvas>
      <div id="hud" hidden></div>
      <div id="overlay"></div>
      <div id="controls" hidden>
        <div id="stick" aria-label="Movement joystick">
          <i></i><span>MOVE</span>
        </div>
        <button id="echo" aria-label="Summon temporal echo">
          ECHO<small>SPACE</small>
        </button>
      </div>
      <div id="toast" role="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
